# Live-only deployment explicitly approved by the owner.
mode: live
allow_live_trading: true

poll_interval_sec: 60
max_markets_per_scan: 300
max_candidates_per_cycle: 100
minimum_confidence: 65

probability_weights:
  historical_context: 0.35
  market_prior: 0.14

timing_weights:
  order_book_imbalance: 0.20
  momentum: 0.14

# Option C final-confidence weights. Direction and the three-point mispricing
# gate remain anchored to the independent historical/context model.
option_c_confidence_weights:
  historical_mentions: 0.30
  event_context: 0.20
  market_prior: 0.15
  microstructure: 0.25
  momentum: 0.10

microstructure:
  enabled: true
  websocket_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  minimum_persistence_sec: 20
  minimum_snapshots: 3
  minimum_trades: 1
  absorption_veto: true

# Book pressure confirms a model signal; it never selects the direction. Three
# consecutive samples are required and confidence can move at most five points.
book_confidence:
  required_samples: 3
  sample_window: 5
  adjustment_scale: 0.10
  max_adjustment_points: 5

historical:
  enabled: true
  refresh_hours: 6
  max_events_per_tag: 500
  resolution_confidence: 0.99

# Official U.S. Government transcripts. GovInfo explicitly publishes sitemaps
# for automated harvesting. Only per-phrase counts and source metadata are
# stored; transcript bodies are discarded after counting.
transcript_history:
  enabled: true
  refresh_hours: 24
  lookback_years: 2
  max_documents: 120
  request_delay_sec: 0.15
  timeout_sec: 25
  user_agent: "MentionEdge/1.0 (GovInfo transcript statistics)"

# Optional historical television subtitles. Add OPENSUBTITLES_API_KEY only in
# the VPS .env. These counts inform history but are never treated as the
# official market-resolution source.
subtitle_history:
  enabled: true
  refresh_hours: 24
  max_prior_episodes: 12
  max_downloads_per_refresh: 5
  timeout_sec: 20
  user_agent: "MentionEdge v1.0"

# Published YouTube transcripts discovered through Supadata. Option C is armed,
# but each exact event/context remains shadow-only until its calibration gate
# passes. Before that point it has zero influence on probability, confidence,
# direction, size, or gates.
# Native transcript mode avoids surprise AI-generation charges. The default
# budget is at most one search plus two transcripts per day (~90 credits/month).
youtube_history:
  enabled: true
  shadow_only_until_calibrated: true
  option_c_armed: true
  minimum_comparable_transcripts: 5
  minimum_resolved_predictions: 30
  minimum_brier_improvement: 0.005
  option_c_weights:
    historical_context: 0.29
    youtube_history: 0.10
    market_prior: 0.10
  minimum_interval_hours: 24
  target_refresh_hours: 720
  max_events_per_refresh: 1
  max_videos_per_event: 2
  search_limit: 8
  upload_date: year
  timeout_sec: 30

tiers:
  - {name: C, min_confidence: 65, max_confidence: 80, size_usd: 3}
  - {name: B, min_confidence: 80, max_confidence: 90, size_usd: 4}
  - {name: A, min_confidence: 90, max_confidence: 93, size_usd: 5}

risk:
  bankroll_usd: 100
  max_open_positions: 5
  max_entry_price: 0.93
  min_entry_price: 0.19
  # Capacity remains a hard execution-safety gate, not a confidence input.
  min_liquidity_usd: 0
  min_volume_usd: 0
  max_spread_pct: 100
  min_model_mispricing_pct: 3
  minimum_independent_samples: 5
  min_timing_score: 0
  max_hours_before_event: 24
  require_known_event_start: true
  max_positions_per_condition: 1
  kill_switch_file: state/HALT

discovery:
  # Verified against Gamma's live /tags endpoint on 2026-08-08. Tag discovery
  # is primary; text search below is only a fallback for newly launched series.
  tag_ids:
    - {id: 105481, label: "Trump Speech Mentions"}
    - {id: 105482, label: "Politics Mentions"}
    - {id: 105486, label: "NFL Mentions"}
    - {id: 100343, label: "Mentions"}
  validate_tags: true
  use_text_search_fallback: true
  # Each query is searched independently. Add exact people, teams, leagues,
  # phrases, or recurring series you want the bot to monitor.
  queries: [Trump, NFL, speech, debate, press conference]
  mention_markers: [say, mention, mentions, mentioned, utter, word, phrase]

news:
  enabled: false

execution:
  maker_first: true
  # GTD post-only quotes have a 45-second effective lifetime. Outside the
  # two-hour urgency window, an unfilled maker simply expires and the next
  # cycle re-evaluates it; no taker order is allowed.
  maker_timeout_sec: 45
  maker_poll_sec: 2
  taker_window_hours: 2
  taker_fallback_order_type: FOK
  price_buffer_ticks: 1
  # Taker fallback is dynamically bounded to the requested 1%-3% range.
  taker_min_slippage_bps: 100
  taker_max_slippage_bps: 300
  trade_confirmation_timeout_sec: 45
  trade_confirmation_poll_sec: 2
  # Maker-only staged profit protection. This is not a stop-loss: no exit
  # floor exists until price first gains 50%, and no floor is below entry.
  profit_lock:
    enabled: true
    maker_only: true
    # Entry prices from $0.45 through $0.93 are exempt and remain held.
    max_entry_price_exclusive: 0.45
    maker_timeout_sec: 45
    stages:
      - {trigger_gain_pct: 50, lock_gain_pct: 0}
      - {trigger_gain_pct: 100, lock_gain_pct: 50}
      - {trigger_gain_pct: 200, lock_gain_pct: 100}
  paper_slippage_bps: 50
  signature_type: 3
  chain_id: 137
  host: "https://clob.polymarket.com"

# Gamma does not always publish the actual speech/kickoff time. Add ISO-8601
# Optional UTC overrides by event slug. Entries require a known start and must
# be no more than 24 hours away.
scheduled_events: {}
# Example:
# scheduled_events:
#   trump-weekly-mentions-august-10: "2026-08-10T18:00:00Z"

paths:
  database: state/mention_bot.sqlite3
  journal: state/trades.jsonl
  log: state/mention_bot.log
  status: state/status.json
