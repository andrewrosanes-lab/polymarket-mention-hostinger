services:
  dashboard:
    build: ./dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      MENTION_BOT_STATUS_FILE: /app/state/status.json
      MENTION_BOT_CONTROL_FILE: /app/state/control.json
      DASHBOARD_ADMIN_TOKEN: ${DASHBOARD_ADMIN_TOKEN:-}
    volumes:
      - mention_state:/app/state

  mention-bot:
    build: ./bot
    restart: unless-stopped
    command: ["python", "run.py"]
    volumes:
      - mention_state:/app/state
    environment:
      PYTHONUNBUFFERED: "1"
      POLYMARKET_PRIVATE_KEY: ${POLYMARKET_PRIVATE_KEY:?Set POLYMARKET_PRIVATE_KEY in Hostinger}
      POLYMARKET_FUNDER_ADDRESS: ${POLYMARKET_FUNDER_ADDRESS:?Set POLYMARKET_FUNDER_ADDRESS in Hostinger}
      CLOB_API_KEY: ${CLOB_API_KEY:-}
      CLOB_SECRET: ${CLOB_SECRET:-}
      CLOB_PASSPHRASE: ${CLOB_PASSPHRASE:-}
      OPENSUBTITLES_API_KEY: ${OPENSUBTITLES_API_KEY:-}
      MENTION_BOT_CONTROL_FILE: /app/state/control.json

volumes:
  mention_state:
